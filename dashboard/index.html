<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Predictive Execution Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="dashboard.js" defer></script>
</head>

<body>
  <h1>Predictive Execution Dashboard</h1>

  <div class="grid">

    <section>
      <h2>State</h2>
      <pre id="state"></pre>
    </section>

    <section>
      <h2>Decision</h2>
      <pre id="decision"></pre>
    </section>

    <section>
      <h2>Federation</h2>
      <pre id="federation"></pre>
    </section>

    <section>
      <h2>Arbitration</h2>
      <pre id="arbitration"></pre>
    </section>

    <section>
      <h2>Recent Episodes</h2>
      <pre id="episodes"></pre>
    </section>

    <section>
      <h2>Performance Samples</h2>
      <pre id="performance"></pre>
    </section>

    <section>
      <h2>Arbitration Precedents</h2>
      <pre id="precedents"></pre>
    </section>

  </div>
</body>
</html>
